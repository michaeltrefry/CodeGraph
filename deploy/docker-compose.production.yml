services:
  codegraph-api:
    image: ${IMAGE_PREFIX:-ghcr.io/tc-trefry/codegraph}-api:${IMAGE_TAG:-latest}
    build: null
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:5037/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      CodeGraph__AuthOptions__Enabled: ${CodeGraph__AuthOptions__Enabled:-true}
      CodeGraph__AuthOptions__Authority: ${CodeGraph__AuthOptions__Authority:-https://identity.trefry.net/realms/trefry}
      CodeGraph__AuthOptions__Audience: ${CodeGraph__AuthOptions__Audience:-codegraph-api}
      CodeGraph__AuthOptions__ClientId: ${CodeGraph__AuthOptions__ClientId:-codegraph-web}
      CodeGraph__AuthOptions__Scope: ${CodeGraph__AuthOptions__Scope:-openid profile email}
      CodeGraph__AuthOptions__AllowedOrigins__0: ${CodeGraph__AuthOptions__AllowedOrigins__0:-https://codegraph.trefry.net}
      CodeGraph__AuthOptions__RequireHttpsMetadata: ${CodeGraph__AuthOptions__RequireHttpsMetadata:-true}
      CodeGraph__McpOptions__RequirePersonalAccessToken: ${CodeGraph__McpOptions__RequirePersonalAccessToken:-true}
      CodeGraph__Indexer__BaseUrl: ${CodeGraph__Indexer__BaseUrl:-http://codegraph-indexer:5042}
      CodeGraph__Indexer__Audience: ${CodeGraph__Indexer__Audience:-codegraph-indexer}
      CodeGraph__Memory__BaseUrl: ${CodeGraph__Memory__BaseUrl:-http://codegraph-memory:5039}
      CodeGraph__Memory__Audience: ${CodeGraph__Memory__Audience:-codegraph-memory}
      CodeGraph__InternalServiceAuth__Enabled: ${CodeGraph__InternalServiceAuth__Enabled:-true}
      CodeGraph__InternalServiceAuth__HmacKey: ${CodeGraph__InternalServiceAuth__HmacKey:-}
      CodeGraph__BranchOverlayOptions__TtlHours: ${CODEGRAPH_BRANCH_OVERLAY_TTL_HOURS:-72}
      CodeGraph__BranchOverlayOptions__SweepIntervalMinutes: ${CODEGRAPH_BRANCH_OVERLAY_SWEEP_INTERVAL_MINUTES:-15}

  codegraph-indexer:
    image: ${IMAGE_PREFIX:-ghcr.io/tc-trefry/codegraph}-indexer:${IMAGE_TAG:-latest}
    build: null
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:5042/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s
    cpus: ${CODEGRAPH_INDEXER_CPUS:-2.0}
    mem_limit: ${CODEGRAPH_INDEXER_MEMORY_LIMIT:-10g}
    memswap_limit: ${CODEGRAPH_INDEXER_MEMORY_LIMIT:-10g}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      CodeGraph__InternalServiceAuth__Enabled: ${CodeGraph__InternalServiceAuth__Enabled:-true}
      CodeGraph__InternalServiceAuth__HmacKey: ${CodeGraph__InternalServiceAuth__HmacKey:-}
      # Empty by default. Provider-qualified canonical repository identities opt in exactly.
      CodeGraph__IndexingOptions__TrustedDotnetRepositories: ${CODEGRAPH_TRUSTED_DOTNET_REPOSITORIES:-}
      CodeGraph__IndexingOptions__RustSemanticCommandTimeoutSeconds: ${CODEGRAPH_RUST_SEMANTIC_TIMEOUT_SECONDS:-600}
      CodeGraph__IndexingOptions__RustSemanticMaxThreads: ${CODEGRAPH_RUST_SEMANTIC_MAX_THREADS:-2}
      CodeGraph__IndexingOptions__RustSemanticStderrTailCharacters: ${CODEGRAPH_RUST_SEMANTIC_STDERR_TAIL_CHARACTERS:-4096}
      CodeGraph__IndexingOptions__RustSemanticCrateGroupSize: ${CODEGRAPH_RUST_SEMANTIC_CRATE_GROUP_SIZE:-8}
      CodeGraph__IndexingOptions__RustSemanticGroupTimeoutSeconds: ${CODEGRAPH_RUST_SEMANTIC_GROUP_TIMEOUT_SECONDS:-600}
      CodeGraph__IndexingOptions__RustSemanticWorkspaceTimeoutSeconds: ${CODEGRAPH_RUST_SEMANTIC_WORKSPACE_TIMEOUT_SECONDS:-3600}
      CodeGraph__IndexingOptions__RustSemanticGroupMemoryLimitMb: ${CODEGRAPH_RUST_SEMANTIC_GROUP_MEMORY_LIMIT_MB:-8192}
      CodeGraph__IndexingOptions__RustSemanticBuildScripts: ${CODEGRAPH_RUST_SEMANTIC_BUILD_SCRIPTS:-false}
      CodeGraph__IndexingOptions__RustSemanticProcMacros: ${CODEGRAPH_RUST_SEMANTIC_PROC_MACROS:-false}
      CodeGraph__BranchOverlayOptions__TtlHours: ${CODEGRAPH_BRANCH_OVERLAY_TTL_HOURS:-72}
      CodeGraph__BranchOverlayOptions__SweepIntervalMinutes: ${CODEGRAPH_BRANCH_OVERLAY_SWEEP_INTERVAL_MINUTES:-15}

  codegraph-memory:
    image: ${IMAGE_PREFIX:-ghcr.io/tc-trefry/codegraph}-memory:${IMAGE_TAG:-latest}
    build: null
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5039 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      CodeGraph__InternalServiceAuth__Enabled: ${CodeGraph__InternalServiceAuth__Enabled:-true}
      CodeGraph__InternalServiceAuth__HmacKey: ${CodeGraph__InternalServiceAuth__HmacKey:-}

  codegraph-metrics:
    image: ${IMAGE_PREFIX:-ghcr.io/tc-trefry/codegraph}-metrics:${IMAGE_TAG:-latest}
    build: null
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5041 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      CodeGraph__InternalServiceAuth__Enabled: ${CodeGraph__InternalServiceAuth__Enabled:-true}
      CodeGraph__InternalServiceAuth__HmacKey: ${CodeGraph__InternalServiceAuth__HmacKey:-}

  jobs:
    image: ${IMAGE_PREFIX:-ghcr.io/tc-trefry/codegraph}-jobs:${IMAGE_TAG:-latest}
    build: null
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/codegraph-jobs.ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      CodeGraph__Indexer__BaseUrl: ${CodeGraph__Indexer__BaseUrl:-http://codegraph-indexer:5042}
      CodeGraph__Indexer__Audience: ${CodeGraph__Indexer__Audience:-codegraph-indexer}
      CodeGraph__InternalServiceAuth__Enabled: ${CodeGraph__InternalServiceAuth__Enabled:-true}
      CodeGraph__InternalServiceAuth__HmacKey: ${CodeGraph__InternalServiceAuth__HmacKey:-}

  codegraph-web:
    image: ${IMAGE_PREFIX:-ghcr.io/tc-trefry/codegraph}-web:${IMAGE_TAG:-latest}
    build: null
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s
