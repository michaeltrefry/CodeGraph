name: Deploy

# Production deploys only a main commit whose CI run (push to main) succeeded. A failed or cancelled
# CI run skips every job here. Manual dispatch deploys the dispatched ref's commit, and only if a CI
# push run succeeded for it.
#
# Images are never built here: CI (push to main) builds, tests and pushes every image tagged with the
# commit SHA, and this workflow deploys exactly those images.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/codegraph
  # workflow_run runs on the default branch's latest commit (github.sha); deploy the commit CI tested.
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  promote:
    name: Promote CI Images
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Require a successful CI push run for the commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&event=push&status=success" --jq '.total_count')"
          if [ "$runs" -lt 1 ]; then
            echo "::error::No successful CI push run for $DEPLOY_SHA; only CI-tested images are deployed."
            exit 1
          fi

      - name: Set image tag
        id: meta
        run: echo "image-tag=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry-side retag of the CI-built images (no rebuild); fails if any SHA-tagged image is missing.
      - name: Tag CI-built images as latest
        run: |
          set -eu
          for image in api jobs indexer memory metrics web; do
            docker buildx imagetools create --tag "$IMAGE_PREFIX-$image:latest" "$IMAGE_PREFIX-$image:$DEPLOY_SHA"
          done

  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: promote
    environment: production
    steps:
      - name: Check deployment gate
        id: deploy-gate
        env:
          CODEGRAPH_DEPLOY_ENABLED: ${{ vars.CODEGRAPH_DEPLOY_ENABLED }}
        run: |
          if [ "$CODEGRAPH_DEPLOY_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment skipped::Production deployment was SKIPPED: CODEGRAPH_DEPLOY_ENABLED is not 'true' on the production environment. Nothing was deployed."
            {
              echo "## Deployment skipped"
              echo
              echo "Production deployment was **skipped**: \`CODEGRAPH_DEPLOY_ENABLED\` is not \`true\` on the production environment, so nothing was deployed or migrated."
              echo "Set \`CODEGRAPH_DEPLOY_ENABLED=true\` on the production environment to enable it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.deploy-gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate deployment configuration
        if: steps.deploy-gate.outputs.enabled == 'true'
        env:
          CODEGRAPH_DEPLOY_HOST: ${{ vars.CODEGRAPH_DEPLOY_HOST || secrets.CODEGRAPH_DEPLOY_HOST }}
          CODEGRAPH_DEPLOY_PATH: ${{ vars.CODEGRAPH_DEPLOY_PATH || secrets.CODEGRAPH_DEPLOY_PATH }}
          CODEGRAPH_DEPLOY_SSH_KEY: ${{ secrets.CODEGRAPH_DEPLOY_SSH_KEY }}
          CODEGRAPH_DEPLOY_SSH_KEY_B64: ${{ secrets.CODEGRAPH_DEPLOY_SSH_KEY_B64 }}
          CODEGRAPH_DEPLOY_USER: ${{ vars.CODEGRAPH_DEPLOY_USER || secrets.CODEGRAPH_DEPLOY_USER }}
          CODEGRAPH__INTERNALSERVICEAUTH__HMACKEY: ${{ secrets.CODEGRAPH__INTERNALSERVICEAUTH__HMACKEY }}
          CODEGRAPH__RABBITMQOPTIONS__PASSWORD: ${{ secrets.CODEGRAPH__RABBITMQOPTIONS__PASSWORD }}
          CODEGRAPH__RABBITMQOPTIONS__USERNAME: ${{ secrets.CODEGRAPH__RABBITMQOPTIONS__USERNAME }}
          CODEGRAPH__REPOSITORYSOURCE__GITHUB__PERSONALACCESSTOKEN: ${{ secrets.CODEGRAPH__REPOSITORYSOURCE__GITHUB__PERSONALACCESSTOKEN }}
          CODEGRAPH__STORAGEOPTIONS__MARIADBCONNECTIONSTRING: ${{ secrets.CODEGRAPH__STORAGEOPTIONS__MARIADBCONNECTIONSTRING }}
          CODEGRAPH__STORAGEOPTIONS__MARIADBENCRYPTIONKEY: ${{ secrets.CODEGRAPH__STORAGEOPTIONS__MARIADBENCRYPTIONKEY }}
        run: |
          missing=0
          for name in \
            CODEGRAPH_DEPLOY_HOST \
            CODEGRAPH_DEPLOY_PATH \
            CODEGRAPH_DEPLOY_USER \
            CODEGRAPH__INTERNALSERVICEAUTH__HMACKEY \
            CODEGRAPH__RABBITMQOPTIONS__PASSWORD \
            CODEGRAPH__RABBITMQOPTIONS__USERNAME \
            CODEGRAPH__REPOSITORYSOURCE__GITHUB__PERSONALACCESSTOKEN \
            CODEGRAPH__STORAGEOPTIONS__MARIADBCONNECTIONSTRING \
            CODEGRAPH__STORAGEOPTIONS__MARIADBENCRYPTIONKEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for production deployment"
              missing=1
            fi
          done

          if [ -z "$CODEGRAPH_DEPLOY_SSH_KEY" ] && [ -z "$CODEGRAPH_DEPLOY_SSH_KEY_B64" ]; then
            echo "::error::CODEGRAPH_DEPLOY_SSH_KEY or CODEGRAPH_DEPLOY_SSH_KEY_B64 is required for production deployment"
            missing=1
          fi

          exit "$missing"

      - name: Create production environment file
        if: steps.deploy-gate.outputs.enabled == 'true'
        env:
          ACTIONS_VARS_JSON: ${{ toJson(vars) }}
          SECRET_INTERNAL_SERVICE_AUTH_HMAC_KEY: ${{ secrets.CODEGRAPH__INTERNALSERVICEAUTH__HMACKEY }}
          SECRET_RABBITMQ_PASSWORD: ${{ secrets.CODEGRAPH__RABBITMQOPTIONS__PASSWORD }}
          SECRET_RABBITMQ_USERNAME: ${{ secrets.CODEGRAPH__RABBITMQOPTIONS__USERNAME }}
          SECRET_REPOSITORY_GITHUB_PAT: ${{ secrets.CODEGRAPH__REPOSITORYSOURCE__GITHUB__PERSONALACCESSTOKEN }}
          SECRET_REPOSITORY_GITHUB_WEBHOOK_SECRET: ${{ secrets.CODEGRAPH__REPOSITORYSOURCE__GITHUB__WEBHOOKSECRET }}
          SECRET_REPOSITORY_GITLAB_TOKEN: ${{ secrets.CODEGRAPH__REPOSITORYSOURCE__GITLAB__PRIVATETOKEN }}
          SECRET_STORAGE_MARIADB_CONNECTION_STRING: ${{ secrets.CODEGRAPH__STORAGEOPTIONS__MARIADBCONNECTIONSTRING }}
          SECRET_STORAGE_MARIADB_ENCRYPTION_KEY: ${{ secrets.CODEGRAPH__STORAGEOPTIONS__MARIADBENCRYPTIONKEY }}
        run: |
          python3 <<'PY'
          import json
          import os

          segment_names = {
              "ANALYSISOPTIONS": "AnalysisOptions",
              "ALLOWEDORIGINS": "AllowedOrigins",
              "ANTHROPIC": "Anthropic",
              "APIKEY": "ApiKey",
              "ASSISTANT": "Assistant",
              "AUDIENCE": "Audience",
              "AUTHOPTIONS": "AuthOptions",
              "AUTHORITY": "Authority",
              "AUTHORIZATIONURL": "AuthorizationUrl",
              "BASEURL": "BaseUrl",
              "CHATCOMPLETIONSPATH": "ChatCompletionsPath",
              "CLIENTID": "ClientId",
              "DEFAULTPROVIDER": "DefaultProvider",
              "DIRECTFALLBACKMAXATTEMPTS": "DirectFallbackMaxAttempts",
              "EMBEDDINGMODELNAME": "EmbeddingModelName",
              "EMBEDDINGMODELPATH": "EmbeddingModelPath",
              "ENABLED": "Enabled",
              "ENDSESSIONURL": "EndSessionUrl",
              "FOLDER": "Folder",
              "GITHUB": "GitHub",
              "GITLAB": "GitLab",
              "HMACKEY": "HmacKey",
              "HOST": "Host",
              "INDEXER": "Indexer",
              "INDEXINGOPTIONS": "IndexingOptions",
              "INTERNALSERVICEAUTH": "InternalServiceAuth",
              "INCLUDEAUTHENTICATEDUSER": "IncludeAuthenticatedUser",
              "ISSUER": "Issuer",
              "LOCAL": "Local",
              "LOCALDEVISADMIN": "LocalDevIsAdmin",
              "LOCALDEVUSERNAME": "LocalDevUsername",
              "LMSTUDIO": "LmStudio",
              "MARIADBCONNECTIONSTRING": "MariaDbConnectionString",
              "MARIADBENCRYPTIONKEY": "MariaDbEncryptionKey",
              "MARIADBMIGRATIONSPATH": "MariaDbMigrationsPath",
              "MAXCONCURRENTREQUESTS": "MaxConcurrentRequests",
              "MAXPARALLELFILES": "MaxParallelFiles",
              "MAXPROMPTNODES": "MaxPromptNodes",
              "MAXRELATIONSHIPTARGETSPERTYPE": "MaxRelationshipTargetsPerType",
              "MAXSOURCECHARS": "MaxSourceChars",
              "MAXTOKENS": "MaxTokens",
              "MAXTURNS": "MaxTurns",
              "MCPOPTIONS": "McpOptions",
              "MEMORY": "Memory",
              "MODEL": "Model",
              "OPENAI": "OpenAi",
              "ORGANIZATION": "Organization",
              "ORGANIZATIONS": "Organizations",
              "PASSWORD": "Password",
              "PERSONALACCESSTOKEN": "PersonalAccessToken",
              "PRIVATETOKEN": "PrivateToken",
              "PROJECT": "Project",
              "PROVIDER": "Provider",
              "RABBITMQOPTIONS": "RabbitMqOptions",
              "REPOSCACHEPATH": "ReposCachePath",
              "REPOSITORYSOURCE": "RepositorySource",
              "REQUIREHTTPSMETADATA": "RequireHttpsMetadata",
              "REQUIREPERSONALACCESSTOKEN": "RequirePersonalAccessToken",
              "ROOTPATH": "RootPath",
              "SCOPE": "Scope",
              "STORAGEOPTIONS": "StorageOptions",
              "TIMEOUTSECONDS": "TimeoutSeconds",
              "TOKENURL": "TokenUrl",
              "TSPORT": "TsPort",
              "USERNAME": "Username",
              "USERACCOUNTS": "UserAccounts",
              "USEJSONOBJECTRESPONSEFORMAT": "UseJsonObjectResponseFormat",
              "WEBHOOKSECRET": "WebhookSecret",
          }

          analysis_options_appsettings_allowlist = {
              "AUTOCOMMITDOCS",
              "AUTOPUSHDOCS",
              "AUTOCOMMITMESSAGE",
              "AUTOCOMMITAUTHORNAME",
              "AUTOCOMMITAUTHOREMAIL",
          }

          pass_through_names = {
              "ASPNETCORE_ENVIRONMENT",
              "CODEGRAPH_EMBEDDING_MODEL_NAME",
              "CODEGRAPH_EMBEDDING_MODEL_ONNX_URL",
              "CODEGRAPH_EMBEDDING_MODEL_VOCAB_URL",
              "CODEGRAPHAPI_DOCKER_HTTPS_PORT",
              "CODEGRAPH_DOCKER_LEGACY_MODELS_MOUNT",
              "CODEGRAPH_DOCKER_MODELS_MOUNT",
              "CODEGRAPH_DOCKER_HTTP_PORT",
              "CODEGRAPH_DOCKER_REPOS_MOUNT",
              "CODEGRAPH_INDEXER_CPUS",
              "CODEGRAPH_INDEXER_DOCKER_HTTP_PORT",
              "CODEGRAPH_INDEXER_MEMORY_LIMIT",
              "CODEGRAPH_MEMORY_DOCKER_HTTP_PORT",
              "CODEGRAPH_METRICS_DOCKER_HTTP_PORT",
              "CODEGRAPH_BRANCH_OVERLAY_SWEEP_INTERVAL_MINUTES",
              "CODEGRAPH_BRANCH_OVERLAY_TTL_HOURS",
              "CODEGRAPH_RUST_SEMANTIC_BUILD_SCRIPTS",
              "CODEGRAPH_RUST_SEMANTIC_CRATE_GROUP_SIZE",
              "CODEGRAPH_RUST_SEMANTIC_GROUP_MEMORY_LIMIT_MB",
              "CODEGRAPH_RUST_SEMANTIC_GROUP_TIMEOUT_SECONDS",
              "CODEGRAPH_RUST_SEMANTIC_MAX_THREADS",
              "CODEGRAPH_RUST_SEMANTIC_PROC_MACROS",
              "CODEGRAPH_RUST_SEMANTIC_STDERR_TAIL_CHARACTERS",
              "CODEGRAPH_RUST_SEMANTIC_TIMEOUT_SECONDS",
              "CODEGRAPH_RUST_SEMANTIC_WORKSPACE_TIMEOUT_SECONDS",
              "CODEGRAPH_SKIP_TS_SIDECAR_WARMUP",
              "CODEGRAPH_TRUSTED_DOTNET_REPOSITORIES",
              "DOTNET_ENVIRONMENT",
          }

          secret_mappings = {
              "CodeGraph__InternalServiceAuth__HmacKey": "SECRET_INTERNAL_SERVICE_AUTH_HMAC_KEY",
              "CodeGraph__RabbitMqOptions__Password": "SECRET_RABBITMQ_PASSWORD",
              "CodeGraph__RabbitMqOptions__Username": "SECRET_RABBITMQ_USERNAME",
              "CodeGraph__RepositorySource__GitHub__PersonalAccessToken": "SECRET_REPOSITORY_GITHUB_PAT",
              "CodeGraph__RepositorySource__GitHub__WebhookSecret": "SECRET_REPOSITORY_GITHUB_WEBHOOK_SECRET",
              "CodeGraph__RepositorySource__GitLab__PrivateToken": "SECRET_REPOSITORY_GITLAB_TOKEN",
              "CodeGraph__StorageOptions__MariaDbConnectionString": "SECRET_STORAGE_MARIADB_CONNECTION_STRING",
              "CodeGraph__StorageOptions__MariaDbEncryptionKey": "SECRET_STORAGE_MARIADB_ENCRYPTION_KEY",
          }

          def compose_key(name):
              if not name.startswith("CODEGRAPH__"):
                  return name

              parts = name.split("__")[1:]
              converted = []
              for part in parts:
                  if part.isdigit():
                      converted.append(part)
                      continue
                  converted.append(segment_names.get(part, part))

              return "CodeGraph__" + "__".join(converted)

          def is_production_llm_runtime_setting(name):
              if not name.upper().startswith("CODEGRAPH__ANALYSISOPTIONS__"):
                  return False

              parts = name.upper().split("__")[2:]
              if not parts:
                  return False

              return parts[0] not in analysis_options_appsettings_allowlist

          def dotenv_value(value):
              return "'" + value.replace("'", "\\'") + "'"

          entries = {
              "ASPNETCORE_ENVIRONMENT": "Production",
              "DOTNET_ENVIRONMENT": "Production",
          }

          action_vars = json.loads(os.environ.get("ACTIONS_VARS_JSON") or "{}")
          for name, value in action_vars.items():
              if value is None or value == "":
                  continue
              if name.startswith("CODEGRAPH_DEPLOY"):
                  continue
              if is_production_llm_runtime_setting(name):
                  print(f"::notice::Skipping {name}; configure LLM providers, models, and caps in the LLM Configuration admin page.")
                  continue
              if name.startswith("CODEGRAPH__"):
                  entries[compose_key(name)] = value
              elif name in pass_through_names:
                  entries[name] = value

          for target_name, env_name in secret_mappings.items():
              value = os.environ.get(env_name)
              if value:
                  entries[target_name] = value

          with open(".env.production", "w", encoding="utf-8") as env_file:
              for name in sorted(entries):
                  env_file.write(f"{name}={dotenv_value(entries[name])}\n")
          PY

      - name: Prepare SSH key
        if: steps.deploy-gate.outputs.enabled == 'true'
        env:
          CODEGRAPH_DEPLOY_HOST: ${{ vars.CODEGRAPH_DEPLOY_HOST || secrets.CODEGRAPH_DEPLOY_HOST }}
          CODEGRAPH_DEPLOY_SSH_KEY: ${{ secrets.CODEGRAPH_DEPLOY_SSH_KEY }}
          CODEGRAPH_DEPLOY_SSH_KEY_B64: ${{ secrets.CODEGRAPH_DEPLOY_SSH_KEY_B64 }}
          CODEGRAPH_DEPLOY_SSH_KEY_PASSPHRASE: ${{ secrets.CODEGRAPH_DEPLOY_SSH_KEY_PASSPHRASE }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$CODEGRAPH_DEPLOY_SSH_KEY" ]; then
            printf '%s\n' "$CODEGRAPH_DEPLOY_SSH_KEY" > ~/.ssh/codegraph_deploy
          else
            echo "$CODEGRAPH_DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/codegraph_deploy
          fi
          chmod 600 ~/.ssh/codegraph_deploy

          eval "$(ssh-agent -s)" >/dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          if [ -n "$CODEGRAPH_DEPLOY_SSH_KEY_PASSPHRASE" ]; then
            export DISPLAY=":0"
            askpass="$(mktemp)"
            cat > "$askpass" <<'EOF'
          #!/bin/sh
          printf '%s' "$CODEGRAPH_DEPLOY_SSH_KEY_PASSPHRASE"
          EOF
            chmod 700 "$askpass"
            export SSH_ASKPASS="$askpass"
            setsid -w ssh-add ~/.ssh/codegraph_deploy < /dev/null
            rm -f "$askpass"
          else
            ssh-add ~/.ssh/codegraph_deploy
          fi

          ssh-keyscan -H "$CODEGRAPH_DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Verify SSH access
        if: steps.deploy-gate.outputs.enabled == 'true'
        env:
          CODEGRAPH_DEPLOY_HOST: ${{ vars.CODEGRAPH_DEPLOY_HOST || secrets.CODEGRAPH_DEPLOY_HOST }}
          CODEGRAPH_DEPLOY_USER: ${{ vars.CODEGRAPH_DEPLOY_USER || secrets.CODEGRAPH_DEPLOY_USER }}
        run: |
          set -eu
          echo "Deploy target: ${CODEGRAPH_DEPLOY_USER}@${CODEGRAPH_DEPLOY_HOST}"
          ssh-add -l
          ssh -o BatchMode=yes -o PasswordAuthentication=no -o PubkeyAuthentication=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$CODEGRAPH_DEPLOY_USER@$CODEGRAPH_DEPLOY_HOST" \
            'echo "ssh ok: $(hostname) $(uname -srm)"'

      - name: Sync deployment files
        if: steps.deploy-gate.outputs.enabled == 'true'
        env:
          CODEGRAPH_DEPLOY_HOST: ${{ vars.CODEGRAPH_DEPLOY_HOST || secrets.CODEGRAPH_DEPLOY_HOST }}
          CODEGRAPH_DEPLOY_PATH: ${{ vars.CODEGRAPH_DEPLOY_PATH || secrets.CODEGRAPH_DEPLOY_PATH }}
          CODEGRAPH_DEPLOY_USER: ${{ vars.CODEGRAPH_DEPLOY_USER || secrets.CODEGRAPH_DEPLOY_USER }}
        run: |
          set -eu
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 "$CODEGRAPH_DEPLOY_USER@$CODEGRAPH_DEPLOY_HOST" "mkdir -p '$CODEGRAPH_DEPLOY_PATH/deploy' '$CODEGRAPH_DEPLOY_PATH/docker'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 docker-compose.yml deploy/docker-compose.production.yml "$CODEGRAPH_DEPLOY_USER@$CODEGRAPH_DEPLOY_HOST:$CODEGRAPH_DEPLOY_PATH/"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 deploy/ensure-embedding-models.sh deploy/verify-deployment.sh "$CODEGRAPH_DEPLOY_USER@$CODEGRAPH_DEPLOY_HOST:$CODEGRAPH_DEPLOY_PATH/deploy/"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 docker/Directory.Build.props "$CODEGRAPH_DEPLOY_USER@$CODEGRAPH_DEPLOY_HOST:$CODEGRAPH_DEPLOY_PATH/docker/Directory.Build.props"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 .env.production "$CODEGRAPH_DEPLOY_USER@$CODEGRAPH_DEPLOY_HOST:$CODEGRAPH_DEPLOY_PATH/.env"

      - name: Deploy over SSH
        if: steps.deploy-gate.outputs.enabled == 'true'
        env:
          CODEGRAPH_DEPLOY_HOST: ${{ vars.CODEGRAPH_DEPLOY_HOST || secrets.CODEGRAPH_DEPLOY_HOST }}
          CODEGRAPH_DEPLOY_PATH: ${{ vars.CODEGRAPH_DEPLOY_PATH || secrets.CODEGRAPH_DEPLOY_PATH }}
          CODEGRAPH_DEPLOY_USER: ${{ vars.CODEGRAPH_DEPLOY_USER || secrets.CODEGRAPH_DEPLOY_USER }}
          IMAGE_TAG: ${{ needs.promote.outputs.image-tag }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 "$CODEGRAPH_DEPLOY_USER@$CODEGRAPH_DEPLOY_HOST" \
            "cd '$CODEGRAPH_DEPLOY_PATH' && \
             docker image prune --all --force && \
             echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin && \
             IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$IMAGE_TAG' sh deploy/ensure-embedding-models.sh && \
             IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.yml -f docker-compose.production.yml pull && \
             IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --no-build --remove-orphans"

      - name: Verify deployment health
        if: steps.deploy-gate.outputs.enabled == 'true'
        timeout-minutes: 15
        env:
          CODEGRAPH_DEPLOY_HOST: ${{ vars.CODEGRAPH_DEPLOY_HOST || secrets.CODEGRAPH_DEPLOY_HOST }}
          CODEGRAPH_DEPLOY_PATH: ${{ vars.CODEGRAPH_DEPLOY_PATH || secrets.CODEGRAPH_DEPLOY_PATH }}
          CODEGRAPH_DEPLOY_USER: ${{ vars.CODEGRAPH_DEPLOY_USER || secrets.CODEGRAPH_DEPLOY_USER }}
          IMAGE_TAG: ${{ needs.promote.outputs.image-tag }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          set -eu
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 "$CODEGRAPH_DEPLOY_USER@$CODEGRAPH_DEPLOY_HOST" \
            "cd '$CODEGRAPH_DEPLOY_PATH' && \
             IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$IMAGE_TAG' CODEGRAPH_DEPLOY_VERIFY_TIMEOUT_SECONDS=600 sh deploy/verify-deployment.sh"
          {
            echo "## Deployment verified"
            echo
            echo "All production services run \`$IMAGE_TAG\`, report healthy (migrations applied), and did not restart."
          } >> "$GITHUB_STEP_SUMMARY"
