name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: codegraph_test!
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:3.13
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/codegraph_test!
        ports:
          - 7687:7687
        options: >-
          --health-cmd="cypher-shell -u neo4j -p codegraph_test! 'RETURN 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      CODEGRAPH_MARIADB_TEST_CONNECTION: Server=127.0.0.1;Port=3306;User ID=root;Password=codegraph_test!;
      CODEGRAPH_NEO4J_TEST_URI: bolt://127.0.0.1:7687
      CODEGRAPH_NEO4J_TEST_USERNAME: neo4j
      CODEGRAPH_NEO4J_TEST_PASSWORD: codegraph_test!
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CodeGraph.sln

      - name: Build
        run: dotnet build CodeGraph.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CodeGraph.sln --configuration Release --no-build --verbosity normal

  windows-attachment-security:
    name: Windows Attachment Security
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test Windows attachment filesystem behavior
        run: >-
          dotnet test src/CodeGraph.Tests/CodeGraph.Tests.csproj
          --configuration Release
          --verbosity normal
          --filter FullyQualifiedName~AttachmentServiceTests

  windows-resolver:
    name: Windows Resolver Security
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run repository resolver security tests
        run: >-
          dotnet test src/CodeGraph.Tests/CodeGraph.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~RepoFileResolverTests"
          --verbosity normal

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CodeGraphWeb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CodeGraphWeb/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --watch=false

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke
        run: npm run test:browser

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: codegraph-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build jobs image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.jobs
          push: false
          tags: codegraph-jobs:ci
          cache-from: type=gha,scope=jobs
          cache-to: type=gha,scope=jobs,mode=max

      - name: Build indexer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.indexer
          push: false
          tags: codegraph-indexer:ci
          cache-from: type=gha,scope=indexer
          cache-to: type=gha,scope=indexer,mode=max

      - name: Build memory image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.memory
          push: false
          tags: codegraph-memory:ci
          cache-from: type=gha,scope=memory
          cache-to: type=gha,scope=memory,mode=max

      - name: Build metrics image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.metrics
          push: false
          tags: codegraph-metrics:ci
          cache-from: type=gha,scope=metrics
          cache-to: type=gha,scope=metrics,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: CodeGraphWeb
          file: CodeGraphWeb/Dockerfile
          push: false
          tags: codegraph-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
