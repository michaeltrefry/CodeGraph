name: CI

on:
  pull_request:
  # A successful run on main is what triggers the production deploy (deploy.yml workflow_run).
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run: every main commit needs its own CI result to be deployable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: codegraph_test!
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:3.13
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/codegraph_test!
        ports:
          - 7687:7687
        options: >-
          --health-cmd="cypher-shell -u neo4j -p codegraph_test! 'RETURN 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      CODEGRAPH_MARIADB_TEST_CONNECTION: Server=127.0.0.1;Port=3306;User ID=root;Password=codegraph_test!;
      CODEGRAPH_NEO4J_TEST_URI: bolt://127.0.0.1:7687
      CODEGRAPH_NEO4J_TEST_USERNAME: neo4j
      CODEGRAPH_NEO4J_TEST_PASSWORD: codegraph_test!
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Service containers cannot take server args, so raise the connection ceiling at runtime.
      # Headroom only: the suite releases its per-database pools and peaks well below 151.
      - name: Raise MariaDB max_connections
        run: |
          docker exec ${{ job.services.mariadb.id }} mariadb -uroot -p'codegraph_test!' \
            -e "SET GLOBAL max_connections = 500"
          docker exec ${{ job.services.mariadb.id }} mariadb -uroot -p'codegraph_test!' -N \
            -e "SELECT @@GLOBAL.max_connections" | grep -qx 500

      - name: Restore
        run: dotnet restore CodeGraph.sln

      - name: Build
        run: dotnet build CodeGraph.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CodeGraph.sln --configuration Release --no-build --verbosity normal

  windows-attachment-security:
    name: Windows Attachment Security
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run cross-platform staging security tests
        run: >-
          dotnet test src/CodeGraph.Tests/CodeGraph.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~ShortcutUploadStagingAreaTests"
          --verbosity normal

      - name: Test Windows attachment filesystem behavior
        run: >-
          dotnet test src/CodeGraph.Tests/CodeGraph.Tests.csproj
          --configuration Release
          --verbosity normal
          --filter FullyQualifiedName~AttachmentServiceTests

  windows-resolver:
    name: Windows Resolver Security
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run repository resolver security tests
        run: >-
          dotnet test src/CodeGraph.Tests/CodeGraph.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~RepoFileResolverTests"
          --verbosity normal

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CodeGraphWeb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CodeGraphWeb/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --watch=false

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke
        run: npm run test:browser

  # One parallel job per image, not gated on Backend/Frontend: deploy.yml only runs after the whole CI
  # run succeeds, so an image pushed here is never deployed unless every job passed for this exact
  # commit. On push to main each image is pushed to GHCR tagged with the commit SHA, and deploy.yml
  # deploys those exact images instead of rebuilding them. PR builds never push images or write the
  # build cache; they only read the cache main wrote.
  docker-build:
    name: Docker Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            file: Dockerfile
          - image: jobs
            context: .
            file: Dockerfile.jobs
          - image: indexer
            context: .
            file: Dockerfile.indexer
          - image: memory
            context: .
            file: Dockerfile.memory
          - image: metrics
            context: .
            file: Dockerfile.metrics
          - image: web
            context: CodeGraphWeb
            file: CodeGraphWeb/Dockerfile
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/codegraph-${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry cache (no 10 GB GitHub Actions cache limit to thrash); the old gha scope stays a read-only fallback.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: ${{ matrix.image == 'indexer' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache
            type=gha,scope=${{ matrix.image }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true', env.IMAGE) || '' }}

      - name: Validate Rust semantic indexing in final image
        if: matrix.image == 'indexer'
        run: docker run --rm "$IMAGE:$GITHUB_SHA" --validate-rust-semantic-indexing

      - name: Validate Swift grammar in final image
        if: matrix.image == 'indexer'
        run: docker run --rm "$IMAGE:$GITHUB_SHA" --validate-swift-grammar

      # Same inputs as "Build image" in the same builder, so this is a full cache hit that only pushes.
      - name: Push image tagged with the tested commit
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  # Native ARM64 runner (free for public repositories) instead of QEMU emulation. Building the
  # final indexer image for linux/arm64 also compiles the arm64 Swift tree-sitter grammar (the
  # tree-sitter-grammars stage), and the image is validated to load it.
  rust-semantic-arm64:
    name: Rust Semantic (ARM64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/codegraph-indexer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ARM64 final indexer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.indexer
          platforms: linux/arm64
          push: false
          load: true
          tags: codegraph-indexer:ci-arm64
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache-arm64
            type=gha,scope=indexer-arm64
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}:buildcache-arm64,mode=max,image-manifest=true,oci-mediatypes=true', env.IMAGE) || '' }}

      - name: Validate Rust semantic indexing in ARM64 final image
        run: docker run --rm --platform linux/arm64 codegraph-indexer:ci-arm64 --validate-rust-semantic-indexing

      - name: Validate Swift grammar in ARM64 final image
        run: docker run --rm --platform linux/arm64 codegraph-indexer:ci-arm64 --validate-swift-grammar
